# ==============================================================================
# PROJETO EFFICIENTIA - ARQUIVO DE CONFIGURAÇÃO DE REFERÊNCIA DO REDIS
# ==============================================================================
# Parâmetros de infraestrutura otimizados para arquitetura multimodelo:
# persistência transacional de Outbox / Streams e memória segura (noeviction).
# ==============================================================================

# Rede e Interface
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Segurança e Recursos
databases 16
maxmemory 512mb

# Política de Descarte de Chaves:
# CRÍTICO: "noeviction" impede descarte arbitrário de eventos do Transactional
# Outbox e Streams caso a memória atinja o limite, forçando retorno de erro OOM
# para o publicador preservar a garantia de entrega "at-least-once".
maxmemory-policy noeviction

# Persistência Híbrida: RDB Snapshot + AOF (Append Only File)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Desempenho e Operação
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Configurações de Streams e Filas
stream-node-max-bytes 4096
stream-node-max-entries 100

# Logs
loglevel notice
logfile ""
